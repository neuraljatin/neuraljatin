    <style><![CDATA[
text, tspan { font-family: Consolas, ui-monospace, 'Liberation Mono', 'Courier New', monospace; }

@keyframes typeWipe {
  from { width: 0; }
  to { width: 248px; }
}
@keyframes blink {
  0%, 45% { opacity: 1; }
  50%, 95% { opacity: 0; }
  100% { opacity: 1; }
}
.cursor { animation: blink 1.2s step-end 2.10s infinite; }


@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    animation-delay: 0s !important;
  }
}

    ]]></style>
