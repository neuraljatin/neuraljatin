<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="86" viewBox="0 0 860 86" role="img" aria-label="Typing tagline">
  <defs>
    <style><![CDATA[
text, tspan { font-family: Consolas, ui-monospace, 'Liberation Mono', 'Courier New', monospace; }

@keyframes typeWipe {
  from { width: 0; }
  to { width: 820px; }
}
@keyframes blink {
  0%, 45% { opacity: 1; }
  50%, 95% { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.type-clip {
  animation: typeWipe 3.2s steps(82, end) forwards;
}
.cursor {
  animation: blink 1.2s step-end 3.2s infinite;
}
.sub {
  animation: fadeIn 0.6s ease 2.2399999999999998s forwards;
}


@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    animation-delay: 0s !important;
  }
}

    ]]></style>
  </defs>
  
  <defs>
    <linearGradient id="bannerGrad_dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#03031c"/>
    </linearGradient>
    <clipPath id="typeClip_dark">
      <rect class="type-clip" x="16" y="8" width="820" height="36"/>
    </clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="85" rx="10" fill="url(#bannerGrad_dark)" stroke="#ffff00" stroke-opacity="0.35"/>
  <g clip-path="url(#typeClip_dark)">
    <text x="22" y="34" font-size="15" font-weight="600">
      <tspan fill="#ffff00">&gt; </tspan>
      <tspan fill="#e6edf3">Hi, I&apos;m Jatin.</tspan>
      <tspan fill="#e6edf3"> Business Systems Analyst who ships: requirements → data → product</tspan>
    </text>
  </g>
  <rect class="cursor" x="22" y="20" width="8" height="18" rx="1" fill="#ffff00"/>
  <text class="sub" x="22" y="64" font-size="12" fill="#8b949e">Business Systems Analyst  ·  Data Analyst  ·  BI Developer</text>

</svg>
